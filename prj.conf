# General
CONFIG_HW_ID_LIBRARY=y

# Logging
CONFIG_LOG=y

# Posix time funcs
CONFIG_POSIX_API=y
CONFIG_POSIX_TIMERS=y

# Google AI: Highly recommended for Nordic targets. A high tick rate like 32768 
# does not cause continuous periodic CPU wakeups or excessive power overhead 
# because the kernel operates in tickless mode
CONFIG_TICKLESS_KERNEL=y

# Serial/UART/Printing
CONFIG_SERIAL=y
CONFIG_CONSOLE=y

# Google AI: disabling CONFIG_SHELL removes the interactive uart_~$ CLI loop.
CONFIG_SHELL=n

CONFIG_PRINTK=n

# Google AI: optional: If you want to completely suppress printk() text from flooding the same port
# (This ensures only formal LOG_* entries make it through)
CONFIG_UART_CONSOLE=n

# Google Ai: tell the logging subsystem to bypass the standard console pipeline 
# and use its dedicated UART backend directly
CONFIG_LOG_BACKEND_UART=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_SOCKETS=y
#CONFIG_NET_SOCKETS_POSIX_NAMES=y
CONFIG_NET_CONFIG_SETTINGS=y

CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000


#============================================================================#
