# CONFIG_STA_KEY_MGMT_NONE=y
CONFIG_STA_KEY_MGMT_WPA2=y
# CONFIG_STA_KEY_MGMT_WPA2_256=y
# CONFIG_STA_KEY_MGMT_WPA3=y
CONFIG_WIFI_CREDENTIALS_STATIC_SSID="Vodafone-8D96F1"
CONFIG_WIFI_CREDENTIALS_STATIC_PASSWORD="z2pTqpFMMX6jXdv3"


# MQTT modifiable configurations
CONFIG_MQTT_SAMPLE_TRANSPORT_DO_PUBLISH=n
CONFIG_MQTT_SAMPLE_TRANSPORT_PUBLISH_TOPIC="publish/topic"
CONFIG_MQTT_SAMPLE_TRANSPORT_SUBSCRIBE_TOPIC="sensors/Feath/ambient"
CONFIG_MQTT_SAMPLE_TRANSPORT_BROKER_HOSTNAME="RPiCM5.local"
CONFIG_MQTT_SAMPLE_TRANSPORT_HELPER_STATIC_IP_ADDRESS="192.168.1.114"
CONFIG_MQTT_SAMPLE_TRANSPORT_BROKER_USERNAME="noUser"
CONFIG_MQTT_SAMPLE_TRANSPORT_BROKER_PASSWORD="noPassword"
CONFIG_MQTT_SAMPLE_TRANSPORT_CLIENT_ID="NordicMQTTClient"
CONFIG_MQTT_SAMPLE_TRANSPORT_MESSAGE="message"
CONFIG_MQTT_SAMPLE_TRIGGER_TIMEOUT_SECONDS=15

#============================================================================#

# Other MQTT configurations
# Enable the MQTT helper library
CONFIG_MQTT_HELPER=y
# This will automatically change the broker port CONFIG_MQTT_HELPER_PORT 
# that the MQTT helper library uses to 8883, which is the standard TLS port 
# for MQTT.
CONFIG_MQTT_LIB_TLS=n
CONFIG_NET_SOCKETS_SOCKOPT_TLS=n
CONFIG_TLS_CREDENTIALS=n
CONFIG_TLS_CREDENTIALS_BACKEND_PROTECTED_STORAGE=n
CONFIG_MBEDTLS_RSA_C=n

CONFIG_MQTT_CLEAN_SESSION=y
CONFIG_MQTT_HELPER_CUSTOM=y
CONFIG_MQTT_HELPER_STATIC_IP_ADDRESS=""
# Set TX/RX buffer size (Default is often 1024 or 2048 depending on the SDK version)
# Eventually 4096
CONFIG_MQTT_HELPER_RX_TX_BUFFER_SIZE=2048  
CONFIG_MQTT_HELPER_PAYLOAD_BUFFER_LEN=4096

# General flags
# ZBus
CONFIG_ZBUS=y

# Zephyr state framework
CONFIG_SMF=y

# Core Hardware Peripherals
CONFIG_GPIO=y
CONFIG_I2C=y

# Enable the Universal Display Subsystem Core
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y
# CONFIG_SSD1306=y
CONFIG_HEAP_MEM_POOL_SIZE=16384

# LED PWM 
CONFIG_PWM=y
